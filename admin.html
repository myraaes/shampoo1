<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการคำสั่งซื้อ — SHAMPOO Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Minimalist Luxury Table Styling for admin.html */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
    }

    .orders-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .orders-table thead {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }

    .orders-table th {
      padding: 1.15rem 1.25rem;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .orders-table td {
      padding: 1.15rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      vertical-align: top;
    }

    .orders-table tbody tr:last-child td {
      border-bottom: none;
    }

    .orders-table tbody tr:hover {
      background-color: var(--bg-primary);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">Shampoo</a>
      <nav class="nav-links" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
        <a href="admin.html" class="active">ระบบหลังบ้าน</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <span class="eyebrow">Order Management</span>
          <h1>รายการคำสั่งซื้อทั้งหมด</h1>
          <p>ข้อมูลคำสั่งซื้อจากลูกค้า เรียงลำดับจากรายการล่าสุดขึ้นก่อน</p>
        </div>

        <div class="table-container">
          <table id="ordersTable" class="orders-table">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>&copy; 2026 SHAMPOO. All rights reserved.</span>
        <span>Admin Dashboard</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
